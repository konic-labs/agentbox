name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests examples scripts
      - name: ruff format
        run: ruff format --check src tests examples scripts
      - name: mypy --strict
        run: mypy src
      - name: Reference docs up to date
        run: python scripts/gen_reference_docs.py --check

  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest tests/unit -q --tb=short --timeout=120
      - name: CLI smoke (no Docker)
        run: bash scripts/ci_smoke.sh

  integration:
    name: integration (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pull sandbox base image
        run: docker pull python:3.12-slim-bookworm
      - name: Docker integration tests
        run: python -m pytest tests/integration -m docker -q --tb=short --timeout=300
      - name: CLI smoke (Docker, mock model)
        run: bash scripts/ci_smoke.sh --docker
      - name: Leftover sandboxes
        if: always()
        run: docker ps -a --filter label=agentbox

  build:
    name: build + metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/agentbox version
          /tmp/wheel-venv/bin/python - <<'PY'
          from importlib import resources
          import agentbox
          assert resources.files("agentbox.data").joinpath("sandbox.Dockerfile").is_file()
          print("agentbox", agentbox.__version__, "wheel ok")
          PY

  # Optional live-endpoint probe; runs only when the secrets are configured.
  provider-smoke:
    runs-on: ubuntu-latest
    needs: unit
    env:
      AGENTBOX_PROVIDER_BASE_URL: ${{ secrets.AGENTBOX_PROVIDER_BASE_URL }}
      AGENTBOX_PROVIDER_MODEL: ${{ secrets.AGENTBOX_PROVIDER_MODEL }}
      AGENTBOX_PROVIDER_API_KEY: ${{ secrets.AGENTBOX_PROVIDER_API_KEY }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [[ -n "$AGENTBOX_PROVIDER_BASE_URL" && -n "$AGENTBOX_PROVIDER_MODEL" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "provider secrets not configured; skipping"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.cfg.outputs.enabled == 'true'
        run: pip install -e ".[dev]"
      - name: Probe the endpoint
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          agentbox doctor \
            --model "$AGENTBOX_PROVIDER_MODEL" \
            --base-url "$AGENTBOX_PROVIDER_BASE_URL" \
            --api-key-env AGENTBOX_PROVIDER_API_KEY
