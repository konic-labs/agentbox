name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest tests/unit -q --tb=short
      - name: CLI smoke
        run: |
          agentbox version
          bash scripts/ci_smoke.sh

  # Optional provider smoke — only when secrets are present
  provider-smoke:
    if: ${{ secrets.AGENTBOX_PROVIDER_BASE_URL != '' && secrets.AGENTBOX_PROVIDER_MODEL != '' }}
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Doctor probe
        env:
          AGENTBOX_PROVIDER_BASE_URL: ${{ secrets.AGENTBOX_PROVIDER_BASE_URL }}
          AGENTBOX_PROVIDER_MODEL: ${{ secrets.AGENTBOX_PROVIDER_MODEL }}
          OPENAI_API_KEY: ${{ secrets.AGENTBOX_PROVIDER_API_KEY }}
        run: |
          agentbox doctor \
            --model "$AGENTBOX_PROVIDER_MODEL" \
            --base-url "$AGENTBOX_PROVIDER_BASE_URL" \
            --api-key "${OPENAI_API_KEY:-EMPTY}"
