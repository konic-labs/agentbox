[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbox-rl"
dynamic = ["version"]
description = "Docker sandboxes, tools, rewards and trajectories for RL post-training of LLM agents (TRL, verl, OpenRLHF, SkyRL, ART)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "AgentBox Contributors" }]
keywords = ["agents", "llm", "docker", "rl", "grpo", "trajectory", "sandbox", "trl", "verl", "openrlhf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "docker>=7.0",
    "pydantic>=2.6",
    "openai>=1.40",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rich = ["rich>=13"]
hf = ["transformers>=4.45", "jinja2>=3.1", "datasets>=2.20", "pyarrow>=15"]
trl = ["trl>=1.0", "transformers>=5.2", "jinja2>=3.1", "datasets>=2.20", "accelerate>=1.0"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
art = ["openpipe-art>=0.4"]
skyrl = ["skyrl-gym"]
generate = ["dspy>=2.5"]
all = [
    "agentbox-rl[rich,hf,server,generate]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
agentbox = "agentbox.cli.main:app"

[project.urls]
Homepage = "https://github.com/konic-labs/agentbox"
Documentation = "https://github.com/konic-labs/agentbox#readme"

[tool.hatch.version]
path = "src/agentbox/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbox"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docker",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "docker: tests that require a running Docker daemon",
]
filterwarnings = ["ignore::DeprecationWarning:tests.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentbox"]
