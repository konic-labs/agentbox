[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbox-rl"
dynamic = ["version"]
description = "Docker sandboxes, tools, rewards and trajectories for RL post-training of LLM agents (TRL, verl, OpenRLHF, SkyRL, ART)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "AgentBox Contributors" }]
keywords = ["agents", "llm", "docker", "rl", "grpo", "trajectory", "sandbox", "trl", "verl", "openrlhf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "docker>=7.0",
    "pydantic>=2.6",
    "openai>=1.40",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rich = ["rich>=13"]
hf = ["transformers>=4.45", "jinja2>=3.1", "datasets>=2.20", "pyarrow>=15"]
trl = ["trl>=1.0", "transformers>=5.2", "jinja2>=3.1", "datasets>=2.20", "accelerate>=1.0"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
art = ["openpipe-art>=0.4"]
skyrl = ["skyrl-gym"]
generate = ["dspy>=2.5"]
all = [
    "agentbox-rl[rich,hf,server,generate]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
agentbox = "agentbox.cli.main:app"

[project.urls]
Homepage = "https://github.com/konic-labs/agentbox"
Documentation = "https://github.com/konic-labs/agentbox/blob/main/docs/index.md"
Changelog = "https://github.com/konic-labs/agentbox/blob/main/CHANGELOG.md"
Issues = "https://github.com/konic-labs/agentbox/issues"

[tool.hatch.version]
path = "src/agentbox/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbox"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "docker: tests that require a running Docker daemon",
]
filterwarnings = ["ignore::DeprecationWarning:tests.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# task payloads are benchmark data: reformatting them changes suite content hashes
extend-exclude = ["examples/benchmarks/*/tasks/*/files"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/agentbox/trajectory/render.py" = ["E501"]  # inline HTML/CSS template
"src/agentbox/agent/protocols.py" = ["E501"]  # verbatim Hermes/Qwen prompt text
"src/agentbox/cli/train.py" = ["E501"]  # script template
"src/agentbox/integrations/openrlhf.py" = ["E501"]  # shell example in docstring
"tests/**" = ["E501"]  # long literal test data
"scripts/art/art.py" = ["E501"]  # SVG markup and alt text

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agentbox"]
mypy_path = "src"

[[tool.mypy.overrides]]
# optional integrations and libraries without type information
module = [
    "docker", "docker.*", "dspy", "dspy.*", "art", "art.*", "trl", "trl.*",
    "verl", "verl.*", "openrlhf", "openrlhf.*", "skyrl_gym", "skyrl_gym.*",
    "datasets", "datasets.*", "pyarrow", "pyarrow.*", "transformers", "transformers.*",
    "fastapi", "fastapi.*", "uvicorn", "uvicorn.*", "peft", "peft.*", "json_repair",
    "rich", "rich.*", "yaml", "tomli",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# human renderers are `lambda: (typer.echo(...), ...)` tuples
module = ["agentbox.cli.*"]
disable_error_code = ["func-returns-value"]

[[tool.mypy.overrides]]
# DSPy signatures/modules subclass untyped dspy classes
module = ["agentbox.tasks.generate.signatures"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# TRL builds tool JSON schemas from these signatures: `self` must stay unannotated
module = ["agentbox.integrations.trl"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
