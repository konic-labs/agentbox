# AgentBox settings read by verl's agent-loop workers ($AGENTBOX_VERL_CONFIG)
sandbox:
  limits: {cpu_count: 1.0, memory_mb: 512, network_disabled: true}
  warm_pool: 8                      # pre-started containers per agent-loop worker
agent:
  tools: [list_files, read_file, write_file, run_tests]
  episode_timeout_s: 600
  tool_timeout_s: 60
rewards:
  - {name: verifier}                # pytest_fraction partial credit comes from the tasks
